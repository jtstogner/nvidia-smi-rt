[package]
name = "nvidia-smi-rt"
version = "0.1.1"
edition = "2024"
authors = ["jtstogner"]
repository = "https://github.com/jtstogner/nvidia-smi-rt"
license = "MIT"
description = "A real-time NVIDIA GPU telemetry terminal dashboard and process manager"
readme = "README.md"
keywords = ["nvidia", "gpu", "nvml", "tui", "monitoring"]
categories = ["command-line-utilities", "hardware-support"]

[features]
default = []
gui = ["dep:eframe", "dep:egui_plot"]

[[bin]]
name = "nvidia-smi-rt"
path = "src/main.rs"

[[bin]]
name = "nvidia-smi-rt-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
nvml-wrapper = "0.13.0"
ratatui = "0.30.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"], optional = true }
egui_plot = { version = "0.38.0", optional = true }
