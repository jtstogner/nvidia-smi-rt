[package]
name = "nvidia-smi-rt"
version = "0.1.1"
edition = "2024"
authors = ["jtstogner"]
repository = "https://github.com/jtstogner/nvidia-smi-rt"
license = "MIT"
description = "A real-time NVIDIA GPU telemetry terminal dashboard and process manager"
readme = "README.md"
keywords = ["nvidia", "gpu", "nvml", "tui", "monitoring"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
nvml-wrapper = "0.13.0"
ratatui = "0.30.2"
